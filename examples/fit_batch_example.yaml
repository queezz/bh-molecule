# BH Batch Fitting Configuration Example
# ========================================
# Use with: bh batch --config fit_batch_example.yaml
#
# This config demonstrates fitting all .fits files in a folder using
# automatic BH signal detection. For a quick test, add --run-fit-limit 5
# to the command line.

# --- Input: folder of FITS files OR a single file ---
# Use exactly ONE of: folder, fits_file, or fits
folder: "~/Dropbox/Experiments/2025-LHD-BH/133mORCA"
# fits_file: "path/to/single/shot.fits"
# fits: "path/to/single/shot.fits"  # alias for fits_file

# --- Required calibration parameters ---
cw: 431.91          # Center wavelength (nm) from CW calibration
scale: 1.0          # Pixel-to-nm scale factor (nm/pixel)

# --- Output directory ---
out_dir: "./bh_batch_results"

# --- Per-fit PNG plots ---
# Save individual fitted-frame plots in <out_dir>/<shot_id>/frames/
# named f{frame:02d}_ch{channel:02d}.png. Default: True.
# save_frames: true

# --- Optional: time axis ---
time_range: [0.0, 10.0]  # [start_s, stop_s] for frame time axis

# --- Optional: dark subtraction ---
# dark_frame: 0  # Frame index to use as dark reference (subtracted from all frames)

# --- Background frames ---
# Averaged per (channel) and subtracted from each (frame, channel) row
# before BH-window cropping and normalization (run_bh_batch).
background_frames: [0, 1, 2, 3]

# --- BH fit / scale wavelength windows (nm) ---
# `bh_fit_range` is cropped before fitting; `bh_scale_range` controls
# the BH-only sub-window used to compute the normalization scale so
# unrelated bright lines (e.g. H-gamma in the full detector range)
# cannot dominate the BH scale.
bh_fit_range:   [433.05, 433.90]
bh_scale_range: [433.08, 433.30]

# --- Signal detection band (nm) ---
# Wavelength range used to detect BH emission above background.
band: [433.0, 433.4]

# --- Signal detection threshold ---
# Frames/channels with intensity > (baseline + threshold_sigma * noise) are selected.
threshold_sigma: 5.0

# --- Manual frame/channel selection (optional) ---
# If omitted or null, automatic signal detection is used.
# frames: [9, 10, 11]
# channels: [30, 31, 32]

# --- Fitter bounds (optional, low-level) ---
# Constrain fit parameters: [C, T_rot, dx, w_inst, base, I_R7, I_R8]
# Prefer the high-level keys below (`w_inst_default`, `w_inst_bounds`,
# `fix_w_inst`, `dx_tol_nm`, `base_bound`) over the raw 7-element vectors.
# `bounds`, if provided, is applied AFTER the fitter is constructed and
# OVERRIDES the high-level keys.
# bounds:
#   lower: [0, 0, -0.3, 0, -10, 0, 0]
#   upper: [10, 10000,  0.3, 0.1, 10, 1, 1]

# --- Explicit, reproducible fitter constraints (recommended) ---
# Each key below is OPTIONAL and *only* applies when set; unset keeps the
# fitter default.  These keys are explicit, inspectable production
# constraints — no per-spectrum auto-bounding, no hidden heuristics.
#
# `w_inst_default` is the initial guess (and the fixed value when
# `fix_w_inst: true`) for the instrumental Gaussian FWHM [nm].  This is
# mostly spectrometer/slit dependent, not a free per-frame parameter; run
# the `examples/14_w_inst_calibration.ipynb` notebook on representative
# spectra before adopting production values.
#
# Use `w_inst_bounds` to tightly constrain the optimizer to a calibrated
# range (recommended), or `fix_w_inst: true` to pin it exactly.
#
# w_inst_default: 0.022
# w_inst_bounds: [0.020, 0.024]
# fix_w_inst: false
#
# `dx_tol_nm` is the half-width [nm] of the allowed wavelength shift; the
# fitter default (0.3) comfortably covers small CW/dispersion mismatches.
# `base_bound` is the half-width of the tight `base` constraint applied
# after the background-subtracted, BH-window-normalized preprocessing.
# dx_tol_nm: 0.3
# base_bound: 0.03

# --- Fitter kwargs (optional) ---
# Additional arguments passed to BHFitter (e.g., nm_window, weight, warm_start)
# fitter_kwargs:
#   nm_window: [433.05, 433.90]
#   weight: "none"
#   warm_start: false

# --- Testing: limit number of fits (command-line preferred) ---
# For quick tests, use: bh batch --config this.yaml --run-fit-limit 5
# You can also set run_fit_limit here, but --run-fit-limit overrides it.
# run_fit_limit: 5
